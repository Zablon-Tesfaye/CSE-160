<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CSE 160 - Assignment 3 | Voxel World</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Courier New', monospace;
      color: #e0e0e0;
    }

    h1 {
      font-size: 1.2rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #7ec8e3;
      margin-bottom: 10px;
    }

    #canvas-container {
      position: relative;
      border: 2px solid #7ec8e3;
      box-shadow: 0 0 30px rgba(126, 200, 227, 0.3);
    }

    canvas {
      display: block;
    }

    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      font-size: 12px;
      color: white;
      text-shadow: 1px 1px 2px black;
      pointer-events: none;
      line-height: 1.8;
    }

    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      color: white;
      font-size: 20px;
      text-shadow: 1px 1px 2px black;
    }

    #controls {
      margin-top: 12px;
      font-size: 11px;
      color: #aaa;
      letter-spacing: 1px;
      text-align: center;
    }
  </style>
</head>
<body>

  <h1>Voxel World Explorer</h1>

  <div id="canvas-container">
    <canvas id="webgl" width="700" height="500"></canvas>

    <div id="hud">
      <div id="fps">FPS: --</div>
      <div id="pos">Pos: (0, 0, 0)</div>
    </div>

    <div id="crosshair">+</div>
  </div>

  <div id="controls">
    W/A/S/D — Move &nbsp;|&nbsp; Q/E — Rotate &nbsp;|&nbsp; Mouse — Look &nbsp;|&nbsp; F — Add Block &nbsp;|&nbsp; G — Delete Block &nbsp;|&nbsp; Collect all ✨ orbs to win!
  </div>

  <!-- ═══════════════════════════════════════════════
       VERTEX SHADER
  ════════════════════════════════════════════════ -->
  <script id="vertex-shader" type="x-shader/x-vertex">
    attribute vec4 a_Position;
    attribute vec2 a_UV;

    uniform mat4 u_ModelMatrix;
    uniform mat4 u_ViewMatrix;
    uniform mat4 u_ProjectionMatrix;

    varying vec2 v_UV;

    void main() {
      gl_Position = u_ProjectionMatrix * u_ViewMatrix * u_ModelMatrix * a_Position;
      v_UV = a_UV;
    }
  </script>

 <!--Fragment shader-->
  <script id="fragment-shader" type="x-shader/x-fragment">
    precision mediump float;

    varying vec2 v_UV;

    uniform vec4 u_FragColor;
    uniform sampler2D u_Sampler0;
    uniform sampler2D u_Sampler1;
    uniform sampler2D u_Sampler2;

    // -1 = solid color only
    //  0 = texture unit 0 (wall/brick)
    //  1 = texture unit 1 (ground/grass)
    //  2 = texture unit 2 (sky)
    uniform int u_texColorWeight;

    void main() {
      if (u_texColorWeight == -1) {
        // Solid color only
        gl_FragColor = u_FragColor;

      } else if (u_texColorWeight == 0) {
        gl_FragColor = texture2D(u_Sampler0, v_UV);

      } else if (u_texColorWeight == 1) {
        gl_FragColor = texture2D(u_Sampler1, v_UV);

      } else if (u_texColorWeight == 2) {
        gl_FragColor = texture2D(u_Sampler2, v_UV);

      } else {
        // Fallback: magenta so we can spot missing assignments
        gl_FragColor = vec4(1.0, 0.0, 1.0, 1.0);
      }
    }
  </script>

  <!--lib files-->
  <script src="lib/webgl-utils.js"></script>
  <script src="lib/cuon-utils.js"></script>
  <script src="lib/cuon-matrix-cse160.js"></script>

  <!--Project files-->
  <script src="Cube.js"></script>
  <script src="Camera.js"></script>
  <script src="World.js"></script>

</body>
</html>
