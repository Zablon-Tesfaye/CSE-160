<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ASG4 - Phong Lighting</title>
  <style>
    body { font-family:Arial,sans-serif; background:#222; color:#eee; padding:15px; margin:0; }
    h1 { color:#ffaa44; margin:0 0 10px 0; font-size:20px; }
    .layout { display:flex; gap:15px; align-items:flex-start; }
    canvas { border:2px solid #555; display:block; background:#111; }
    .panels { display:flex; flex-direction:column; gap:10px; min-width:260px; }
    .panel { background:#333; border:1px solid #555; border-radius:6px; padding:10px 14px; }
    .panel h3 { margin:0 0 8px 0; font-size:12px; color:#ffaa44; text-transform:uppercase; letter-spacing:1px; border-bottom:1px solid #555; padding-bottom:5px; }
    .row { display:flex; align-items:center; margin-bottom:6px; gap:6px; }
    .row label { font-size:12px; width:95px; flex-shrink:0; color:#ccc; }
    .row input[type=range] { flex:1; cursor:pointer; accent-color:#ffaa44; }
    .row span { font-size:11px; color:#aaa; width:36px; text-align:right; }
    button { width:100%; padding:6px; margin-bottom:5px; background:#444; color:#eee; border:1px solid #666; border-radius:4px; cursor:pointer; font-size:12px; }
    button:hover { background:#555; }
    button.on  { background:#1a5c1a; border-color:#4caf50; }
    button.off { background:#5c1a1a; border-color:#f44336; }
    button.active { background:#1a3a5c; border-color:#2196f3; }
  </style>
</head>
<body onload="main()">
  <h1>ASG4 — Phong Lighting</h1>
  <div class="layout">
    <canvas id="webgl" width="700" height="600"></canvas>
    <div class="panels">

      <div class="panel">
        <h3>Camera</h3>
        <div class="row"><label>Rotate X</label><input type="range" id="cam-x" min="-89" max="89" value="20" step="1"><span id="v-cx">20</span></div>
        <div class="row"><label>Rotate Y</label><input type="range" id="cam-y" min="-180" max="180" value="30" step="1"><span id="v-cy">30</span></div>
      </div>

      <div class="panel">
        <h3>Lighting Toggles</h3>
        <button id="btn-light" class="on">Lighting: ON</button>
        <button id="btn-normals">Show Normals: OFF</button>
        <button id="btn-spot">Spot Light: OFF</button>
      </div>

      <div class="panel">
        <h3>Light Position</h3>
        <div class="row"><label>Anim Speed</label><input type="range" id="light-speed" min="0" max="5" step="0.1" value="1"><span id="v-ls">1.0</span></div>
        <div class="row"><label>Height Y</label><input type="range" id="light-y" min="-2" max="5" step="0.1" value="2"><span id="v-ly">2.0</span></div>
        <div class="row"><label>Manual X</label><input type="range" id="light-x" min="-5" max="5" step="0.1" value="0"><span id="v-lx">0.0</span></div>
      </div>

      <div class="panel">
        <h3>Light Color</h3>
        <div class="row"><label>Red</label>  <input type="range" id="lc-r" min="0" max="1" step="0.01" value="1"><span id="v-lr">1.00</span></div>
        <div class="row"><label>Green</label><input type="range" id="lc-g" min="0" max="1" step="0.01" value="1"><span id="v-lg">1.00</span></div>
        <div class="row"><label>Blue</label> <input type="range" id="lc-b" min="0" max="1" step="0.01" value="1"><span id="v-lb">1.00</span></div>
      </div>

      <div class="panel">
        <h3>Spot Light</h3>
        <div class="row"><label>Cutoff Angle</label><input type="range" id="spot-cut" min="5" max="80" step="1" value="25"><span id="v-sc">25</span></div>
      </div>

    </div>
  </div>

  <script src="lib/webgl-utils.js"></script>
  <script src="lib/webgl-debug.js"></script>
  <script src="lib/cuon-utils.js"></script>
  <script src="lib/cuon-matrix-cse160.js"></script>
  <script src="asg4.js"></script>
</body>
</html>
